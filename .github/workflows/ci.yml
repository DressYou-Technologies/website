name: ci
on:
  push: { branches: [main] }
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --check dist/app.mjs
      - run: node --test tests/*.test.mjs
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          [[ "$TITLE" =~ ^(feat|fix|docs|test|refactor|perf|build|ci|chore)(\([a-z0-9-]+\))?:\ [^A-Z].{0,71}$ && "$TITLE" != *. ]] \
            || { echo "PR title must be 'type(scope): subject', lowercase, no trailing period, <= 72 chars"; exit 1; }
